name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner's preinstalled sdkmanager is the wrong version and hangs on
      # an interactive "Review licenses (y/N)?" prompt, which fails the job.
      # Install a pinned cmdline-tools and accept the licenses non-interactively.
      - name: Install Android SDK
        env:
          CMDLINE_TOOLS: 11076708
          CMDLINE_SHA256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"

          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS}_latest.zip"
          echo "${CMDLINE_SHA256}  /tmp/cmdline-tools.zip" | sha256sum -c -

          mkdir -p "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest" /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Provide SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Hermes Glasses ${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            app/build/outputs/apk/debug/app-debug.apk \
            || gh release upload "${{ steps.tag.outputs.tag }}" \
                 app/build/outputs/apk/debug/app-debug.apk \
                 --clobber

      - name: Summary
        run: |
          {
            echo "### Hermes Glasses ${{ steps.tag.outputs.tag }}"
            echo ""
            echo "Download \`app-debug.apk\` from the release assets."
            echo ""
            echo "The APK is signed with the standard Android **debug key** — it installs"
            echo "by sideloading, but not over a Play Store build of the same package."
          } >> "$GITHUB_STEP_SUMMARY"
