name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner's preinstalled sdkmanager is the wrong version and hangs on
      # an interactive "Review licenses (y/N)?" prompt, which fails the job.
      # Install a pinned cmdline-tools and accept the licenses non-interactively.
      - name: Install Android SDK
        env:
          CMDLINE_TOOLS: 11076708
          CMDLINE_SHA256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          echo "SDK root: $SDK_ROOT"

          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS}_latest.zip"
          echo "${CMDLINE_SHA256}  /tmp/cmdline-tools.zip" | sha256sum -c -

          mkdir -p "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest" /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version

          # Accept every license without a prompt.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Provide SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-glasses-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  bridge:
    name: Bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r bridge/requirements.txt

      - name: Run the test suite
        run: |
          cd bridge
          python -m pytest tests/ -v

      - name: Health endpoint boots
        run: |
          cd bridge
          GLASSES_WORK_DIR=/tmp/gb-ci python bridge.py &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8790/health > /dev/null; then
              echo "bridge is up"
              curl -s http://127.0.0.1:8790/health | python -m json.tool
              exit 0
            fi
            sleep 1
          done
          echo "bridge failed to start"
          exit 1
