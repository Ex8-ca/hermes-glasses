name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # setup-android can hang on an interactive "Review licenses (y/N)?"
      # prompt, which fails the job. Accept every license up front.
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --licenses < /dev/null > /dev/null 2>&1 || true

      - name: Provide SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties

      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-glasses-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  bridge:
    name: Bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r bridge/requirements.txt

      - name: Run the test suite
        run: |
          cd bridge
          python -m pytest tests/ -v

      - name: Health endpoint boots
        run: |
          cd bridge
          GLASSES_WORK_DIR=/tmp/gb-ci python bridge.py &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8790/health > /dev/null; then
              echo "bridge is up"
              curl -s http://127.0.0.1:8790/health | python -m json.tool
              exit 0
            fi
            sleep 1
          done
          echo "bridge failed to start"
          exit 1
